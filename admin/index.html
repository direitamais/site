<!doctype html>

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- GitHub Pages não deixa enviar cabeçalhos HTTP; a CSP vai por meta.
       Só scripts deste site e do supabase-js (com SRI, em admin.js); rede
       só para o Supabase. frame-ancestors não vale em meta: a proteção
       contra o painel ser embutido num iframe fica em admin.js. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">

  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="toast" role="status"></div>

       o servidor local (scripts/local-admin.py) entrega { mode: 'local' }. -->
